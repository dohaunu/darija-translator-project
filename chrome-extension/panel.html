<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Darija Translator</title><link rel="stylesheet" href="panel.css"></head>
<body><main><h1>🇲🇦 Darija Translator</h1><label>Source language <input id="language" value="English" maxlength="40"></label><label>Text to translate<textarea id="text" rows="7" placeholder="Select text on a page and right-click…"></textarea></label><button id="translate">Translate</button><label>Darija translation<textarea id="result" rows="7" readonly></textarea></label><p id="status" role="status"></p><details><summary>Connection settings</summary><label>API URL<input id="url" value="http://localhost:8080/darija-translator/api/translate"></label><label>Username<input id="username" value="translator"></label><label>Password<input id="password" type="password" autocomplete="off"></label><button id="save">Save settings</button><small>Use localhost for development. Do not store production credentials in the extension.</small></details></main><script src="panel.js"></script></body></html>
